name: Release R6 IG Publisher

# Builds the IG Publisher CLI against the patched core jars published by the
# glichtner/org.hl7.fhir.core release workflow (tag prefix r5-${R6_LABEL}-),
# and publishes it as a GitHub release tagged ${R6_LABEL}-<timestamp>.
# The CLI jar is also attached under the stable name publisher.jar so that
# consumers can use .../releases/latest/download/publisher.jar.

on:
  push:
    branches: [master]
    paths:
      - 'org.hl7.fhir.publisher.core/**'
      - 'org.hl7.fhir.publisher.cli/**'
      - 'pom.xml'
      - '.github/workflows/release-r6.yml'
      - '.github/smoke-ig/**'
  workflow_dispatch:
    inputs:
      core_tag:
        description: 'Tag of glichtner/org.hl7.fhir.core release to consume (leave blank for latest)'
        required: false
        type: string

permissions:
  contents: write

env:
  R6_LABEL: ballot5

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Read project versions
        id: ver
        run: |
          # IG Publisher version
          IGP_VERSION=$(mvn -q -Dexpression=project.version -DforceStdout -f pom.xml help:evaluate)
          echo "igp_version=$IGP_VERSION" >> $GITHUB_OUTPUT
          # core_version from <properties>
          CORE_VERSION=$(grep -oE '<core_version>[^<]+</core_version>' pom.xml | head -1 | sed 's/<[^>]*>//g')
          echo "core_version=$CORE_VERSION" >> $GITHUB_OUTPUT
          echo "IG Publisher: $IGP_VERSION; core: $CORE_VERSION"

      - name: Resolve core release tag
        id: coretag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -n "${{ inputs.core_tag }}" ]; then
            TAG="${{ inputs.core_tag }}"
          else
            TAG=$(gh release list --repo glichtner/org.hl7.fhir.core --limit 50 --json tagName,name \
                  --jq '.[] | select(.tagName | startswith("r5-'"${R6_LABEL}"'-")) | .tagName' | head -1)
          fi
          if [ -z "$TAG" ]; then
            echo "::error::No core ${R6_LABEL} release found on glichtner/org.hl7.fhir.core."
            exit 1
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "Using core release: $TAG"

      - name: Download core jars from release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p /tmp/core-jars
          gh release download "${{ steps.coretag.outputs.tag }}" \
            --repo glichtner/org.hl7.fhir.core \
            --pattern 'org.hl7.fhir.*.jar' \
            --dir /tmp/core-jars
          ls -la /tmp/core-jars/

      - name: Install core jars into local Maven repo
        run: |
          set -e
          V="${{ steps.ver.outputs.core_version }}"
          for m in org.hl7.fhir.utilities org.hl7.fhir.r4 org.hl7.fhir.r4b org.hl7.fhir.r5 org.hl7.fhir.convertors org.hl7.fhir.validation; do
            JAR="/tmp/core-jars/${m}-${V}.jar"
            if [ ! -f "$JAR" ]; then
              echo "::error::Missing $JAR — release does not contain it (check that <core_version> in pom.xml matches the core release version)."
              exit 1
            fi
            mvn install:install-file --no-transfer-progress \
              -Dfile="$JAR" \
              -DgroupId=ca.uhn.hapi.fhir \
              -DartifactId="$m" \
              -Dversion="$V" \
              -Dpackaging=jar
          done

      # -nsu (--no-snapshot-updates) is essential: upstream publishes real
      # SNAPSHOT jars of the same version to the Sonatype snapshot repo, and
      # without it Maven could silently replace our locally installed fork
      # jars with upstream's.
      - name: Build IG Publisher
        run: mvn -nsu clean package -DskipTests -Dmaven.javadoc.skip=true --no-transfer-progress

      - name: Identify CLI jar
        id: jar
        run: |
          JAR=$(ls org.hl7.fhir.publisher.cli/target/org.hl7.fhir.publisher.cli-*.jar \
                | grep -vE 'sources|javadoc|original-' | head -1)
          echo "path=$JAR" >> $GITHUB_OUTPUT
          echo "name=$(basename "$JAR")" >> $GITHUB_OUTPUT
          cp "$JAR" /tmp/publisher.jar
          ls -la "$JAR"

      # Smoke test: build a minimal ballot5 IG with the freshly built jar
      # before publishing the release. The fixture's profile pair re-slices an
      # extension slice (the pattern that exposed the ballot5 snapshot
      # recursion), so this exercises the version whitelist, package seeding
      # (incl. the package fixes), snapshot generation and the full render
      # pipeline. A failure blocks the release.
      - name: Set up Ruby (for Jekyll)
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      - name: Install Jekyll
        run: gem install jekyll

      - name: Smoke test the built publisher
        run: |
          .github/smoke-ig/seed-packages.sh
          JAVA_TOOL_OPTIONS="-Xmx4g -Dfile.encoding=UTF-8" \
            java -jar "${{ steps.jar.outputs.path }}" -ig .github/smoke-ig

      - name: Build release tag
        id: tag
        run: |
          STAMP=$(date -u +%Y%m%d-%H%M%S)
          TAG="${R6_LABEL}-${STAMP}"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "stamp=$STAMP" >> $GITHUB_OUTPUT

      - name: Write release notes
        run: |
          cat > /tmp/notes.md <<EOF
          # IG Publisher with R6 ${{ env.R6_LABEL }} support

          Built from \`${{ github.ref_name }}\` @ \`${{ github.sha }}\`
          Project version: \`${{ steps.ver.outputs.igp_version }}\`
          Consumed core release: [\`${{ steps.coretag.outputs.tag }}\`](https://github.com/glichtner/org.hl7.fhir.core/releases/tag/${{ steps.coretag.outputs.tag }}) (\`${{ steps.ver.outputs.core_version }}\`)

          ## Run

          \`\`\`bash
          java -jar publisher.jar -ig /path/to/ig.ini
          \`\`\`

          ## What this fork adds
          - Allows \`6.0.0-ballot4\` and \`6.0.0-ballot5\` in the PublisherIGLoader version whitelist
          - Null-safe StructureDefinitionRenderer for profiles whose base type doesn't resolve
          - Consumes the R5 core jars with R6 ballot spec deltas applied

          The jar is attached both under its Maven name and as \`publisher.jar\`
          (stable URL: \`releases/latest/download/publisher.jar\`).
          EOF

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: IG Publisher ${{ env.R6_LABEL }} ${{ steps.tag.outputs.stamp }}
          body_path: /tmp/notes.md
          files: |
            ${{ steps.jar.outputs.path }}
            /tmp/publisher.jar
          draft: false
          prerelease: false
