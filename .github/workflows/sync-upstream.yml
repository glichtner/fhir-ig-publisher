name: Sync with upstream

on:
  # Weekly check: opens a sync PR when upstream has new commits.
  # Merging the PR triggers release-r6.yml (new publisher release, i.e.
  # releases/latest moves), so merges are deliberate acts. No auto-merge.
  schedule:
    - cron: '0 5 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      UPSTREAM_REPO: HL7/fhir-ig-publisher
      UPSTREAM_BRANCH: master
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch upstream
        run: |
          git remote add upstream https://github.com/${UPSTREAM_REPO}.git
          git fetch upstream ${UPSTREAM_BRANCH}

      - name: Diff status
        id: check
        run: |
          BEHIND=$(git rev-list --count HEAD..upstream/${UPSTREAM_BRANCH})
          AHEAD=$(git rev-list --count upstream/${UPSTREAM_BRANCH}..HEAD)
          echo "behind=$BEHIND" >> $GITHUB_OUTPUT
          echo "ahead=$AHEAD" >> $GITHUB_OUTPUT
          echo "Behind upstream by $BEHIND, ahead by $AHEAD (our patches)."

      - name: Open sync PR (if behind)
        if: steps.check.outputs.behind != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DATE=$(date -u +%Y-%m-%d)
          BRANCH="sync/upstream-${DATE}"
          git checkout -b "$BRANCH"
          if git merge --no-edit upstream/${UPSTREAM_BRANCH}; then
            STATUS=clean
          else
            STATUS=conflict
            git diff --name-only --diff-filter=U > /tmp/conflicts.txt || true
            git merge --abort || true
            # push the upstream state as the PR branch so GitHub shows the
            # conflicting files and the merge can be resolved in the PR
            git checkout -B "$BRANCH" upstream/${UPSTREAM_BRANCH}
          fi
          git push --force origin "$BRANCH"
          BODY=$(printf '%s\n' \
            "Automated upstream sync." \
            "" \
            "- Upstream: \`${UPSTREAM_REPO}@${UPSTREAM_BRANCH}\`" \
            "- Behind by: ${{ steps.check.outputs.behind }} commits" \
            "- Our patches ahead: ${{ steps.check.outputs.ahead }} commits" \
            "- Merge status: **${STATUS}**" \
            "" \
            "⚠️ Known conflict point: \`<core_version>\` in pom.xml must stay pinned to the" \
            "glichtner/org.hl7.fhir.core fork version (upstream pins its own releases)." \
            "Merging to master triggers release-r6.yml, i.e. releases/latest moves." \
            "")
          if [ "$STATUS" = "conflict" ] && [ -s /tmp/conflicts.txt ]; then
            BODY="$BODY

          Conflicting files (resolve manually, then verify with a clean \`mvn package\`):
          \`\`\`
          $(cat /tmp/conflicts.txt)
          \`\`\`"
          fi
          gh pr create --base master --head "$BRANCH" \
            --title "Sync upstream ($DATE, ${{ steps.check.outputs.behind }} commits, $STATUS)" \
            --body "$BODY" || echo "PR may already exist"
