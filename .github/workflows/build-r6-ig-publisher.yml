name: Build IG Publisher with FHIR R6

on:
  workflow_dispatch:
    inputs:
      r6_source:
        description: 'R6 FHIR definitions source'
        required: true
        type: choice
        options:
          - 'committed'
          - 'ballot4'
          - 'ci-build'
        default: 'committed'
      core_branch:
        description: 'org.hl7.fhir.core branch'
        required: false
        type: string
        default: 'master'
  push:
    branches: [master]

jobs:
  build-r6:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      # --- Checkout repos (before setup-java so cache can find pom.xml) ---
      - name: Checkout fhir-ig-publisher
        uses: actions/checkout@v4
        with:
          path: fhir-ig-publisher

      - name: Checkout org.hl7.fhir.core (with committed r6 module)
        uses: actions/checkout@v4
        with:
          repository: glichtner/org.hl7.fhir.core
          ref: ${{ inputs.core_branch || 'master' }}
          path: org.hl7.fhir.core

      # --- Setup ---
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      # --- Optional: refresh model from latest ballot4 / ci-build ---
      - name: Download CI build package
        if: inputs.r6_source == 'ci-build'
        run: |
          curl -sL https://build.fhir.org/package.tgz -o /tmp/r6-package.tgz
          mkdir -p /tmp/r6-extract
          tar xzf /tmp/r6-package.tgz -C /tmp/r6-extract
          R6_VERSION=$(python3 -c "import json; print(json.load(open('/tmp/r6-extract/package/package.json'))['version'])")
          echo "R6_VERSION=$R6_VERSION" >> $GITHUB_ENV
          echo "Detected R6 CI build version: $R6_VERSION"
          CACHE_DIR="$HOME/.fhir/packages/hl7.fhir.r6.core#${R6_VERSION}"
          mkdir -p "$CACHE_DIR"
          cp -r /tmp/r6-extract/* "$CACHE_DIR/"

      - name: Set ballot4 version
        if: inputs.r6_source == 'ballot4'
        run: echo "R6_VERSION=6.0.0-ballot4" >> $GITHUB_ENV

      - name: Build code generator
        if: inputs.r6_source != 'committed'
        working-directory: org.hl7.fhir.core/org.hl7.fhir.core.generator
        run: mvn package -DskipTests --no-transfer-progress

      - name: Refresh R6 model from generator
        if: inputs.r6_source != 'committed'
        working-directory: org.hl7.fhir.core/org.hl7.fhir.core.generator
        run: |
          echo "Regenerating R6 model code from FHIR version: $R6_VERSION"
          mvn exec:java \
            -Dexec.mainClass="org.hl7.fhir.core.generator.engine.JavaCoreGenerator" \
            -Dexec.args="${R6_VERSION} ${{ github.workspace }}/org.hl7.fhir.core/org.hl7.fhir.core.generator/configuration ${{ github.workspace }}/org.hl7.fhir.core/org.hl7.fhir.r6 --skip-extensions"

      - name: Apply post-generation patches
        if: inputs.r6_source != 'committed'
        working-directory: org.hl7.fhir.core
        run: |
          echo "=== Post-generation patches required when refreshing model from ballot4/ci-build ==="
          echo "See HANDOVER_R6_CI.md §6 for the full list."
          echo "TODO: extract patches into a script (e.g. scripts/patch-r6-generated.sh) and invoke here."
          echo "For now, with r6_source=committed (default) this step is skipped."
          # Minimal automated patches that always apply:
          # 1. Ensure Utilities import is present in Enumerations.java
          if ! grep -q "import org.hl7.fhir.utilities.Utilities;" \
              org.hl7.fhir.r6/src/main/java/org/hl7/fhir/r6/model/Enumerations.java; then
            sed -i '/import org.hl7.fhir.exceptions.FHIRException;/i import org.hl7.fhir.utilities.Utilities;' \
              org.hl7.fhir.r6/src/main/java/org/hl7/fhir/r6/model/Enumerations.java
          fi
          # 2. InventoryItem.java rename
          sed -i 's/CommonLanguagesEnumFactory/AllLanguagesEnumFactory/g; s/CommonLanguages/AllLanguages/g' \
            org.hl7.fhir.r6/src/main/java/org/hl7/fhir/r6/model/InventoryItem.java || true
          echo "WARNING: refresh mode is not fully automated; expect compile failures that need manual fixes."

      # --- Verify R6 module compiles (sanity check) ---
      - name: Verify org.hl7.fhir.r6 compiles
        working-directory: org.hl7.fhir.core
        run: |
          for m in org.hl7.fhir.utilities org.hl7.fhir.r4 org.hl7.fhir.r4b org.hl7.fhir.r5; do
            mvn install -pl "$m" -am -Dmaven.test.skip=true -Dmaven.javadoc.skip=true --no-transfer-progress
          done
          mvn install -pl org.hl7.fhir.r6 -Dmaven.test.skip=true -Dmaven.javadoc.skip=true --no-transfer-progress

      # --- Update dependent modules to use R6 ---
      - name: Update convertors module for R6
        working-directory: org.hl7.fhir.core
        run: |
          find org.hl7.fhir.convertors/src -name "*.java" \
            -exec sed -i 's/org\.hl7\.fhir\.r5/org.hl7.fhir.r6/g' {} +
          sed -i 's|<artifactId>org\.hl7\.fhir\.r5</artifactId>|<artifactId>org.hl7.fhir.r6</artifactId>|g' \
            org.hl7.fhir.convertors/pom.xml

      - name: Update validation module for R6
        working-directory: org.hl7.fhir.core
        run: |
          find org.hl7.fhir.validation/src -name "*.java" \
            -exec sed -i 's/org\.hl7\.fhir\.r5/org.hl7.fhir.r6/g' {} +
          sed -i 's|<artifactId>org\.hl7\.fhir\.r5</artifactId>|<artifactId>org.hl7.fhir.r6</artifactId>|g' \
            org.hl7.fhir.validation/pom.xml

      - name: Update validation.cli module for R6
        working-directory: org.hl7.fhir.core
        run: |
          find org.hl7.fhir.validation.cli/src -name "*.java" \
            -exec sed -i 's/org\.hl7\.fhir\.r5/org.hl7.fhir.r6/g' {} +
          sed -i 's|<artifactId>org\.hl7\.fhir\.r5</artifactId>|<artifactId>org.hl7.fhir.r6</artifactId>|g' \
            org.hl7.fhir.validation.cli/pom.xml

      - name: Update fhir-ig-publisher for R6
        run: |
          find fhir-ig-publisher -name "*.java" \
            -exec sed -i 's/org\.hl7\.fhir\.r5/org.hl7.fhir.r6/g' {} +
          sed -i 's|<artifactId>org\.hl7\.fhir\.r5</artifactId>|<artifactId>org.hl7.fhir.r6</artifactId>|g' \
            fhir-ig-publisher/pom.xml

      # --- Rebuild everything with R6 ---
      - name: Rebuild org.hl7.fhir.core with R6
        working-directory: org.hl7.fhir.core
        run: mvn install -Dmaven.test.skip=true -Dmaven.javadoc.skip=true --no-transfer-progress

      - name: Build fhir-ig-publisher
        working-directory: fhir-ig-publisher
        run: mvn package -DskipTests -Dmaven.javadoc.skip=true --no-transfer-progress

      # --- Upload artifacts ---
      - name: Upload IG Publisher CLI jar
        uses: actions/upload-artifact@v4
        with:
          name: ig-publisher-r6-${{ inputs.r6_source || 'committed' }}
          path: fhir-ig-publisher/org.hl7.fhir.publisher.cli/target/*.jar
          retention-days: 30
