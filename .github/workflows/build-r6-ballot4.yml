name: Build IG Publisher with R6 ballot4 support

on:
  workflow_dispatch:
    inputs:
      test_ig:
        description: 'Optional: URL to a ballot4 IG to smoke-test the built jar (leave empty to skip)'
        required: false
        type: string
        default: ''
  push:
    branches: [master]
    paths:
      - 'org.hl7.fhir.publisher.core/src/main/java/org/hl7/fhir/igtools/publisher/PublisherIGLoader.java'
      - '.github/workflows/build-r6-ballot4.yml'
      - 'pom.xml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      # Sanity check: confirm our ballot4 allowance is present.
      - name: Verify ballot4 whitelist
        run: |
          grep -q '6.0.0-ballot4' \
            org.hl7.fhir.publisher.core/src/main/java/org/hl7/fhir/igtools/publisher/PublisherIGLoader.java \
            || (echo "ballot4 not whitelisted in PublisherIGLoader.java"; exit 1)

      # IG Publisher pulls org.hl7.fhir.core from Maven Central (core_version pinned in pom.xml).
      # We do NOT need to build core ourselves — upstream core master already supports R6 ballot4
      # via the R6ToR5Loader path. The only IG Publisher fork change is the version whitelist.
      - name: Build IG Publisher
        run: mvn package -DskipTests -Dmaven.javadoc.skip=true --no-transfer-progress

      - name: Capture the CLI jar
        id: jar
        run: |
          JAR=$(ls org.hl7.fhir.publisher.cli/target/org.hl7.fhir.publisher.cli-*.jar | grep -v 'sources\|javadoc' | head -1)
          echo "jar=$JAR" >> $GITHUB_OUTPUT
          echo "Built: $JAR"

      - name: Upload IG Publisher CLI jar
        uses: actions/upload-artifact@v4
        with:
          name: ig-publisher-ballot4
          path: ${{ steps.jar.outputs.jar }}
          retention-days: 30

      # Optional smoke test against a ballot4 IG.
      - name: Smoke test against ballot4 IG
        if: inputs.test_ig != ''
        run: |
          mkdir -p /tmp/test-ig
          cd /tmp/test-ig
          # Accept either a tgz package URL or a git repo (.git suffix).
          if [[ "${{ inputs.test_ig }}" == *.git ]]; then
            git clone --depth 1 "${{ inputs.test_ig }}" repo
            IG_DIR=$(pwd)/repo
          else
            curl -sL "${{ inputs.test_ig }}" -o ig.tgz
            tar xzf ig.tgz
            IG_DIR=$(pwd)/package
          fi
          # Find the IG.ini or sushi-config.yaml to confirm it's an IG
          ls "$IG_DIR"
          # Run the publisher
          java -jar ${{ github.workspace }}/${{ steps.jar.outputs.jar }} -ig "$IG_DIR" || \
            echo "Smoke test exited non-zero — check log above"
